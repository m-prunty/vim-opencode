name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vim 9.1 (minimal)
        run: |
          sudo apt-get update
          sudo apt-get install -y vim curl
          vim --version | head -3

      - name: Run headless smoke tests
        run: ./test/run.sh
