name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        vim: ['9.1']
    steps:
      - uses: actions/checkout@v4

      - name: Install Vim 9.1
        run: |
          sudo apt-get update
          sudo apt-get install -y liblua5.1-dev libperl-dev libpython3-dev \
            libruby-dev libncurses5-dev libgtk-3-dev libx11-dev libxt-dev
          cd /tmp
          wget -q https://github.com/vim/vim/archive/refs/tags/v9.1.0000.tar.gz
          tar xzf v9.1.0000.tar.gz
          cd vim-9.1.0000
          ./configure --with-features=huge \
            --enable-multibyte \
            --enable-python3interp=yes \
            --enable-perlinterp=yes \
            --enable-rubyinterp=yes \
            --enable-luainterp=yes \
            --enable-cscope \
            --enable-gui=auto \
            --enable-fail-if-missing
          make -j$(nproc)
          sudo make install

      - name: Verify Vim version
        run: vim --version | head -5

      - name: Run headless smoke tests
        run: ./test/run.sh

      - name: Check Vim9 compilation (defcompile)
        run: |
          vim -Nu NONE -es -i NONE --cmd "set runtimepath^=$PWD" \
            -c "defcompile autoload/opencode9/util.vim" \
            -c "defcompile autoload/opencode9/config.vim" \
            -c "defcompile autoload/opencode9/server.vim" \
            -c "defcompile autoload/opencode9/commands.vim" \
            -c "defcompile autoload/opencode9/context.vim" \
            -c "defcompile autoload/opencode9/prompt.vim" \
            -c "defcompile autoload/opencode9/state.vim" \
            -c "defcompile autoload/opencode9/transport.vim" \
            -c "defcompile autoload/opencode9/discovery.vim" \
            -c "defcompile autoload/opencode9/events.vim" \
            -c "defcompile autoload/opencode9/health.vim" \
            -c "defcompile autoload/opencode9/protocol/adapter.vim" \
            -c "defcompile autoload/opencode9/protocol/v1.vim" \
            -c "defcompile autoload/opencode9/protocol/v2.vim" \
            -c "defcompile autoload/opencode9/catalog.vim" \
            -c "defcompile autoload/opencode9/permissions.vim" \
            -c "defcompile autoload/opencode9/review.vim" \
            -c "defcompile autoload/opencode9/sessions.vim" \
            -c "defcompile autoload/opencode9/tabs.vim" \
            -c "defcompile autoload/opencode9/quickchat.vim" \
            -c "defcompile autoload/opencode9/ui/diff.vim" \
            -c "defcompile autoload/opencode9/ui/panel.vim" \
            -c "defcompile autoload/opencode9/ui/render.vim" \
            -c "defcompile ftplugin/opencode9_input.vim" \
            -c "defcompile ftplugin/opencode9_output.vim" \
            -c "defcompile plugin/vim-opencode.vim" \
            -c "qa!" || echo "defcompile warnings may be non-fatal"

      - name: Source plugin check
        run: vim -Nu NONE -es -i NONE --cmd "set runtimepath^=$PWD" -c "source plugin/vim-opencode.vim" -c "qa!"
